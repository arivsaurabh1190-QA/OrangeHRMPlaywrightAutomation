
name: OrangeHRM Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: Run UI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run pytest
        run: python -m pytest -v -n 0

      - name: Upload test reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangehrm-test-results
          path: |
            report.html
            test-results/
            **/test-results/
          if-no-files-found: ignore
          retention-days: 14
